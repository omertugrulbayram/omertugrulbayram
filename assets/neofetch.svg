<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 380" width="850" height="380">
  <defs>
    
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000000" fill-opacity="0.28" />
    </pattern>

    
    <radialGradient id="crt-vignette" cx="50%" cy="50%" r="65%">
      <stop offset="60%" stop-color="#140d03" stop-opacity="0" />
      <stop offset="100%" stop-color="#050300" stop-opacity="0.72" />
    </radialGradient>

    
    <linearGradient id="scanbar-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFB000" stop-opacity="0" />
      <stop offset="50%" stop-color="#FFB000" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#FFB000" stop-opacity="0" />
    </linearGradient>

    <clipPath id="screen-clip">
      <rect x="10" y="10" width="830" height="360" rx="10" />
    </clipPath>
  </defs>

  <style>
    .bg { fill: #0d0802; stroke: #805800; stroke-width: 1.5; }
    .topbar { fill: #1a1104; }
    .divider { stroke: #664600; stroke-width: 1; }
    .mono {
      font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, Monaco, monospace;
      font-size: 13.5px;
      fill: #FFB000;
      filter: url(#glow);
    }
    .dim { fill: #996900; }
    .bright { fill: #FFD166; font-weight: bold; }
    .ascii {
      font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace;
      font-size: 13px;
      fill: #FFB000;
      filter: url(#glow);
    }
    .status-text {
      font-family: 'JetBrains Mono', Consolas, monospace;
      font-size: 12px;
      fill: #0d0802;
      font-weight: bold;
    }
    .status-dim {
      font-family: 'JetBrains Mono', Consolas, monospace;
      font-size: 12px;
      fill: #FFB000;
    }

    /* Sıralı Boot / Fade-in Animasyonu */
    .line { opacity: 0; animation: boot 0.15s forwards; }
    .l1 { animation-delay: 0.15s; }
    .l2 { animation-delay: 0.30s; }
    .l3 { animation-delay: 0.45s; }
    .l4 { animation-delay: 0.60s; }
    .l5 { animation-delay: 0.75s; }
    .l6 { animation-delay: 0.90s; }
    .l7 { animation-delay: 1.05s; }
    .l8 { animation-delay: 1.20s; }
    .l9 { animation-delay: 1.35s; }
    .l10 { animation-delay: 1.50s; }

    @keyframes boot {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* Yanıp Sönen İmleç */
    .cursor {
      animation: blink 1s step-end infinite;
    }
    @keyframes blink {
      0%, 50% { opacity: 1; }
      50.01%, 100% { opacity: 0; }
    }

    /* Hafif CRT Titremesi */
    .crt-flicker {
      animation: flicker 6s infinite;
    }
    @keyframes flicker {
      0%, 96%, 100% { opacity: 1; }
      97% { opacity: 0.94; }
      98% { opacity: 0.99; }
      99% { opacity: 0.96; }
    }

    /* Aşağı Akan Tarama Çubuğu */
    .scanbar {
      animation: scan 7s linear infinite;
    }
    @keyframes scan {
      0% { transform: translateY(-60px); }
      100% { transform: translateY(420px); }
    }
  </style>

  
  <rect class="bg" x="10" y="10" width="830" height="360" rx="10" />

  <g clip-path="url(#screen-clip)" class="crt-flicker">
    
    <rect class="topbar" x="10" y="10" width="830" height="32" />
    <line class="divider" x1="10" y1="42" x2="840" y2="42" />

    
    <circle cx="30" cy="26" r="5" fill="#FFB000" />
    <circle cx="48" cy="26" r="5" fill="#B37B00" />
    <circle cx="66" cy="26" r="5" fill="#664600" />
    <text x="425" y="30" text-anchor="middle" class="mono dim" font-size="12">root@omertugrul: ~ (tty1)</text>

    
    <text x="32" y="70" class="mono line l1">
      <tspan class="bright">omertugrul@crt</tspan><tspan class="dim">:</tspan><tspan class="bright">~</tspan><tspan class="dim">$ </tspan>neofetch --amber
    </text>

    
    <g class="ascii line l2">
      <text x="52" y="112" xml:space="preserve">  __________________  </text>
      <text x="52" y="129" xml:space="preserve"> |  ______________  | </text>
      <text x="52" y="146" xml:space="preserve"> | | &gt;_           | | </text>
      <text x="52" y="163" xml:space="preserve"> | |  0xDEADBEEF  | | </text>
      <text x="52" y="180" xml:space="preserve"> | |  SEC // DEV  | | </text>
      <text x="52" y="197" xml:space="preserve"> | |  SYS: READY  | | </text>
      <text x="52" y="214" xml:space="preserve"> | |______________| | </text>
      <text x="52" y="231" xml:space="preserve"> |__________________| </text>
      <text x="52" y="248" xml:space="preserve">      ___|___|___     </text>
      <text x="52" y="265" xml:space="preserve">     /___________\    </text>
      <text x="52" y="290" xml:space="preserve" class="dim">   [ CRT-AMBER 84 ]   </text>
    </g>

    
    <line class="divider" x1="278" y1="95" x2="278" y2="305" stroke-dasharray="3 4" />

    
    <text x="305" y="112" class="mono bright line l2">omertugrul@github</text>
    <text x="305" y="130" class="mono dim line l2">─────────────────────────────────────────</text>

    <text x="305" y="154" class="mono line l3"><tspan class="bright">ROLE    </tspan><tspan class="dim">:: </tspan>Security Researcher &amp; Developer</text>
    <text x="305" y="176" class="mono line l4"><tspan class="bright">FOCUS   </tspan><tspan class="dim">:: </tspan>Offensive Sec · Web/API · CTF · Cloud</text>
    <text x="305" y="198" class="mono line l5"><tspan class="bright">STACK   </tspan><tspan class="dim">:: </tspan>Python · C/C++ · JS · Bash</text>
    <text x="305" y="220" class="mono line l6"><tspan class="bright">TOOLS   </tspan><tspan class="dim">:: </tspan>Burp · Nmap · Nuclei · Docker</text>
    <text x="305" y="242" class="mono line l7"><tspan class="bright">ENV     </tspan><tspan class="dim">:: </tspan>Kali Linux / Windows 11</text>
    <text x="305" y="264" class="mono line l8"><tspan class="bright">STATUS  </tspan><tspan class="dim">:: </tspan>Hunting bugs &amp; automating workflows <tspan class="cursor">█</tspan></text>

    
    <g class="line l9">
      <rect x="305" y="286" width="24" height="14" fill="#332300" />
      <rect x="331" y="286" width="24" height="14" fill="#664600" />
      <rect x="357" y="286" width="24" height="14" fill="#996900" />
      <rect x="383" y="286" width="24" height="14" fill="#CC8C00" />
      <rect x="409" y="286" width="24" height="14" fill="#FFB000" />
      <rect x="435" y="286" width="24" height="14" fill="#FFC84D" />
      <rect x="461" y="286" width="24" height="14" fill="#FFE099" />
    </g>

    
    <line class="divider" x1="10" y1="336" x2="840" y2="336" />
    <rect x="10" y="336" width="830" height="34" fill="#1a1104" />
    <rect x="10" y="336" width="88" height="34" fill="#FFB000" />
    <text x="54" y="357" text-anchor="middle" class="status-text">[0] bash*</text>
    <text x="115" y="357" class="status-dim">[1] recon   [2] ctf-solver   [3] exploit-dev</text>
    <text x="822" y="357" text-anchor="end" class="status-dim">UTC+3 | ONLINE</text>

    
    <rect class="scanbar" x="10" y="0" width="830" height="55" fill="url(#scanbar-grad)" />
    <rect x="10" y="10" width="830" height="360" fill="url(#scanlines)" />
    <rect x="10" y="10" width="830" height="360" fill="url(#crt-vignette)" />
  </g>
</svg>
