<radialGradient id="g1"><stop offset="0" stop-color="#d9c6ff" stop-opacity="0.95"/><stop offset="1" stop-color="#d9c6ff" stop-opacity="0"/></radialGradient>
<radialGradient id="g2"><stop offset="0" stop-color="#ffd3de" stop-opacity="0.95"/><stop offset="1" stop-color="#ffd3de" stop-opacity="0"/></radialGradient>
</defs>
<rect width="840" height="340" rx="28" fill="#f5f5f7"/>
