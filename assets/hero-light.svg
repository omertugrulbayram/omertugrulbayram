<svg xmlns="http://www.w3.org/2000/svg" width="840" height="340" viewBox="0 0 840 340" role="img" aria-label="Ömer Bayram — Güvenlik Araştırmacısı" fill="none">
<title>Ömer Bayram — Güvenlik Araştırmacısı</title>
<style>.t{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI Variable Display','Segoe UI','Helvetica Neue',Inter,Roboto,Arial,sans-serif}@media (prefers-reduced-motion:reduce){*{animation:none!important}}@keyframes d1{50%{transform:translate(-40px,26px)}}@keyframes d2{50%{transform:translate(36px,-22px)}}@keyframes d3{50%{transform:translate(-26px,-30px)}}.b1{animation:d1 16s ease-in-out infinite}.b2{animation:d2 19s ease-in-out infinite}.b3{animation:d3 22s ease-in-out infinite}</style>
<defs>
