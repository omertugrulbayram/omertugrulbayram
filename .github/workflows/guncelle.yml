# Sayıları ve katkı ızgarasını her gün yeniler; değişiklik yoksa commit atmaz.
name: Profili güncelle
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build.js
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Değişiklik varsa kaydet
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || { git commit -m 'Profil sayıları güncellendi' && git push; }
